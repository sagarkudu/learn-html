<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Components Example</title>
</head>
<body>

    <!-- Heading -->
    <h1>Web Components Example</h1>

    <!-- Explanation -->
    <!-- 
    Web Components are a set of standardized technologies that allow developers to create reusable custom HTML elements and encapsulate their functionality, styling, and structure. They consist of four main specifications: Custom Elements, Shadow DOM, HTML Templates, and HTML Imports.
    Custom Elements enable developers to define their own custom HTML elements with their desired behavior and properties, extending the built-in elements or creating entirely new ones.
    Shadow DOM provides encapsulation for custom elements, allowing them to have their own scoped CSS styles and DOM structure, preventing conflicts with the styles and structure of the rest of the document.
    HTML Templates allow developers to define reusable chunks of markup that can be cloned and inserted into the document as needed, providing a way to create complex structures without having to manually create and manipulate DOM elements.
    HTML Imports enable the inclusion of external HTML documents as dependencies, allowing developers to import and reuse HTML components across different pages or projects.
    Web Components promote modularity, reusability, and maintainability of code, making it easier to build and maintain complex web applications.
    -->

    <!-- Example of a custom web component -->
    <my-custom-element></my-custom-element>

    <!-- Script to define the custom element -->
    <script>
        // Define a custom element
        customElements.define('my-custom-element', class extends HTMLElement {
            constructor() {
                super();
                // Create a shadow DOM
                const shadow = this.attachShadow({ mode: 'open' });
                // Create a paragraph element
                const paragraph = document.createElement('p');
                // Set content for the paragraph
                paragraph.textContent = 'This is a custom web component.';
                // Append the paragraph to the shadow DOM
                shadow.appendChild(paragraph);
            }
        });
    </script>

    <!-- Example of using an imported HTML template -->
    <div id="imported-template"></div>

    <!-- Script to import and use the HTML template -->
    <script>
        // Import the HTML template
        const importLink = document.createElement('link');
        importLink.rel = 'import';
        importLink.href = 'template.html';
        document.head.appendChild(importLink);

        // Wait for the import to finish
        importLink.onload = () => {
            // Clone the imported template
            const template = importLink.import.querySelector('#my-template');
            const clone = document.importNode(template.content, true);
            // Append the cloned template to the document
            document.getElementById('imported-template').appendChild(clone);
        };
    </script>

</body>
</html>
