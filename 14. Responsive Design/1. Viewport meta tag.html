<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewport Meta Tag Example</title>
</head>
<body>

    <!-- Heading -->
    <h1>Viewport Meta Tag Example</h1>

    <!-- Code -->
    <code>
        <pre>
            &lt;meta name="viewport" content="width=device-width, initial-scale=1.0"&gt;
        </pre>
    </code>

    <!-- Explanation -->
    <!-- 
    The viewport meta tag is used to control the layout and scaling of the webpage on different devices.
    The content attribute specifies the width of the viewport to be the width of the device screen.
    The initial-scale attribute sets the initial zoom level when the page is first loaded.
    -->

</body>
</html>
