<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries Example</title>
    <style>
        /* Default styles for the webpage */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            color: #333;
            margin: 0;
            padding: 0;
        }
        
        h1 {
            text-align: center;
        }
        
        .content {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
        }

        /* Media query for smaller screens */
        @media screen and (max-width: 600px) {
            .content {
                width: 90%;
            }
        }

        /* Media query for medium screens */
        @media screen and (min-width: 601px) and (max-width: 1024px) {
            .content {
                width: 70%;
            }
        }

        /* Media query for larger screens */
        @media screen and (min-width: 1025px) {
            .content {
                width: 60%;
            }
        }
    </style>
</head>
<body>

    <!-- Heading -->
    <h1>Media Queries Example</h1>

    <!-- Content -->
    <div class="content">
        <p>This is an example of how media queries can be used to apply different styles based on the screen size.</p>
    </div>

</body>
</html>

<!-- Explanation:
- Media queries are used to apply different styles based on the characteristics of the device or browser window.
- In this example, we have defined three sets of styles for different screen sizes:
  - Default styles are applied to all screens.
  - Styles inside the media query (max-width: 600px) are applied to screens with a maximum width of 600 pixels.
  - Styles inside the media query (min-width: 601px) and (max-width: 1024px) are applied to screens with a width between 601 and 1024 pixels.
  - Styles inside the media query (min-width: 1025px) are applied to screens with a width greater than 1025 pixels.
-->
