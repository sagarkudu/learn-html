<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    
</head>
<body>
    <p>
        Update text with by clicking button
    </p>

    <button id="button">Click me</button>
    <div id="text">Initial Text</div>

    <script>
        var element = document.getElementById('button')
        var text = document.getElementById('text')

        function updateClick() {
            console.log('clicked')
            text.innerHTML = 'updated text'
        }

        function addListener() {
            element.addEventListener('click', updateClick, {once: true})
        }

        addListener()

        // Note- now rerender will not happen again and again
       </script>

       <p>
    No more extra listeners will be added now! Iternally it will get of memory space
       </p>
       <p>
        
       </p>
</body>
</html>
