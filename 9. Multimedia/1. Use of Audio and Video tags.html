<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Example</title>
</head>
<body>

    <!-- Audio Example -->
    <h2>Audio Example</h2>
    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- Video Example -->
    <h2>Video Example</h2>
    <video width="320" height="240" controls>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

     <!-- Youtube Video Example -->
     <h2>Video Example</h2>
     <!-- YouTube Embed Code -->
     <iframe width="560" height="315" src="https://www.youtube.com/embed/MDwBsbgXMkM" frameborder="0" allowfullscreen></iframe>
 

    <!-- Explanation -->
    <!-- 
    The <audio> tag is used to embed sound content in a document.
    The <video> tag is used to embed video content in a document.
    The <source> tag specifies multiple media resources for media elements.
    -->

</body>
</html>
