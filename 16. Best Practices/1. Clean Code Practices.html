<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Code Practices Example</title>
</head>
<body>

    <!-- Heading -->
    <h1>Clean Code Practices Example</h1>



    <!-- Example of clean code practices -->

    <!-- Descriptive Naming -->
    <p id="userProfile">User Profile</p>

    <!-- Consistent Formatting -->
    <script>
        function calculateTotal(price, quantity) {
            return price * quantity;
        }
    </script>

    <!-- Modularization -->
    <script src="utils.js"></script>

    <!-- Commenting -->
    <script>
        // Function to calculate the total cost
        function calculateTotal(price, quantity) {
            return price * quantity;
        }
    </script>

    <!-- Avoiding Duplication -->
    <script>
        function calculateTotal(price, quantity) {
            return price * quantity;
        }

        function calculateTax(price, taxRate) {
            return price * taxRate;
        }
    </script>

        <!-- Explanation -->
    <!-- 
    Clean code practices are essential for writing maintainable and understandable code. Some key principles include:
    - Descriptive naming: Use meaningful and descriptive names for variables, functions, and components to improve code readability.
    - Consistent formatting: Adopt a consistent coding style throughout your project, including indentation, spacing, and naming conventions.
    - Modularization: Break down your code into smaller, reusable modules or functions to improve code organization and maintainability.
    - Commenting: Include clear and concise comments to explain complex logic, algorithms, or any non-obvious parts of your code.
    - Avoiding duplication: Refactor repetitive code into reusable functions or components to reduce redundancy and improve code maintainability.
    -->

</body>
</html>
